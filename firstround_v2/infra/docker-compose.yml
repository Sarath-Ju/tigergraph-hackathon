# TigerGraph and the TigerGraph GraphRAG service, set up the way the GraphRAG tutorial does it.
# It runs as its own compose project with its own data volume, so it does not touch anything else.
#
# First write the service config from your .env, then start everything:
#   python infra/render_config.py
#   docker compose -f infra/docker-compose.yml up -d
# To also get TigerGraph's chat and admin UI on http://localhost, add the ui profile:
#   docker compose -f infra/docker-compose.yml --profile ui up -d
name: agr-v2

services:
  tigergraph:
    image: tigergraph/community:4.2.2
    platform: linux/amd64
    ports:
      - "14240:14240"
    volumes:
      - tigergraph_data:/home/tigergraph/tigergraph/data

  graphrag:
    image: tigergraph/graphrag:latest
    platform: linux/amd64
    ports:
      - "8000:8000"
    depends_on: [graphrag-ecc, chat-history, tigergraph]
    environment:
      SERVER_CONFIG: "/code/configs/server_config.json"
      LOGLEVEL: "INFO"
      USE_CYPHER: "true"
    volumes:
      - ./configs/:/code/configs

  graphrag-ecc:
    image: tigergraph/graphrag-ecc:latest
    platform: linux/amd64
    ports:
      - "8001:8001"
    environment:
      SERVER_CONFIG: "/code/configs/server_config.json"
      LOGLEVEL: "INFO"
      INIT_EMBED_STORE: "false"
    volumes:
      - ./configs/:/code/configs

  chat-history:
    image: tigergraph/chat-history:latest
    platform: linux/amd64
    ports:
      - "8002:8002"
    environment:
      CONFIG_FILES: "/configs/server_config.json"
      LOGLEVEL: "INFO"
    volumes:
      - ./configs/:/configs

  graphrag-ui:
    image: tigergraph/graphrag-ui:latest
    platform: linux/amd64
    profiles: [ui]
    ports:
      - "3000:3000"
    depends_on: [graphrag]

  nginx:
    image: nginx
    profiles: [ui]
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on: [graphrag-ui, graphrag]

volumes:
  tigergraph_data:
